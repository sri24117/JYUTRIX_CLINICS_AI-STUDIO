name: Reliability checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      # Type check plus syntax checks for the frontend scripts.
      - run: npm run lint
      - name: Start demo server
        run: |
          APP_MODE=demo PORT=8001 ADMIN_PASSWORD=ui-test-password-12345 npx tsx server.ts > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8001/health && exit 0
            sleep 1
          done
          echo "Server did not become healthy"; cat server.log; exit 1
      # DOM smoke test: login, demo booking, settings, XSS escaping, takeover, logout.
      - run: node tests/ui-smoke.cjs
      - if: failure()
        run: cat server.log || true
